[workspace]
resolver = "2"
members = [
    "crates/kernel",
    "crates/physics",
    "crates/data",
    "crates/plant",
    "crates/governor",
    "crates/reality-os",
    "crates/session",
    "crates/ros2",
    "crates/embodiment",
    "crates/vision",
    "crates/rate",
    "crates/agent",
    "crates/gauntlet",
    "crates/vport",
    "crates/hil",
    "crates/metal",
    "crates/virtual-metal",
    "crates/verify",
    "crates/semantics",
    "apps/ros-governor",
]
default-members = [
    "crates/kernel",
    "crates/physics",
    "crates/data",
    "crates/plant",
    "crates/governor",
    "crates/reality-os",
    "crates/session",
    "crates/ros2",
    "crates/embodiment",
    "crates/vision",
    "crates/rate",
    "crates/agent",
    "crates/gauntlet",
    "crates/vport",
    "crates/hil",
    "crates/metal",
    "crates/virtual-metal",
    "crates/verify",
    "crates/semantics",
    "apps/ros-governor",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.80"
authors = ["TheWorld Reality OS"]
description = "Last-gate Governor + Reality OS kernel in Rust. SIM ≠ metal. Learned systems never write motors."
repository = "https://github.com/theworld/reality-os-rust"

[workspace.dependencies]
realityos-kernel = { path = "crates/kernel" }
realityos-physics = { path = "crates/physics" }
realityos-data = { path = "crates/data" }
realityos-plant = { path = "crates/plant" }
realityos-governor = { path = "crates/governor" }
realityos-core = { path = "crates/reality-os" }
realityos-session = { path = "crates/session" }
realityos-ros2 = { path = "crates/ros2" }
realityos-embodiment = { path = "crates/embodiment" }
realityos-vision = { path = "crates/vision" }
realityos-rate = { path = "crates/rate" }
realityos-agent = { path = "crates/agent" }
realityos-gauntlet = { path = "crates/gauntlet" }
realityos-vport = { path = "crates/vport" }
realityos-hil = { path = "crates/hil" }
realityos-metal = { path = "crates/metal" }
realityos-virtual-metal = { path = "crates/virtual-metal" }
realityos-verify = { path = "crates/verify" }
realityos-semantics = { path = "crates/semantics" }
serialport = { version = "4.7", default-features = false }
nix = { version = "0.26", default-features = false, features = ["term"] }

serde = { version = "1", features = ["derive"] }
fs2 = "0.4"
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
proptest = "1"
trybuild = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "allow", priority = -1 }
too_many_arguments = "allow"
derivable_impls = "allow"
collapsible_match = "allow"
manual_range_contains = "allow"
needless_pass_by_value = "allow"
