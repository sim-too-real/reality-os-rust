name: authority

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_frozen_holdouts:
        description: Run the frozen MuJoCo holdout suite once after decisions are frozen.
        required: true
        default: false
        type: boolean

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # Metal ONLINE software watchdog misses if a journal+seal fsync exceeds
      # 100 ms. Running those tests inside the workspace smash races HIL ledger
      # I/O (push `authority` flake on 491462d). Isolated, single-threaded.
      - name: test-metal
        run: cargo test -p realityos-metal --all-targets -- --test-threads=1
      - name: test-virtual-metal
        run: cargo test -p realityos-virtual-metal
      - name: virtual-metal-tier2-smoke
        run: cargo run -p realityos-virtual-metal --bin virtual-metal-campaign -- --seed 42 --n 64 --tier 2 --out /tmp/vm-tier2.json
      - name: virtual-metal-tier2-honesty
        run: |
          python3 - <<'PY'
          import json
          rec = json.load(open("/tmp/vm-tier2.json"))
          assert rec.get("hardware_present") is False, rec
          assert rec.get("evidence_status") == "SIM_VIRTUAL_METAL_NOT_METAL", rec
          assert rec.get("schema") == "realityos.virtual_metal/1", rec
          assert rec.get("schema") != "realityos.metal_proof/1"
          assert rec.get("n_fail", 1) == 0, rec
          holds = [r for r in rec.get("rows", []) if r.get("scenario") == "tier2_hold"]
          assert holds, rec
          assert any(
              (r.get("physical_actions") or 0) > 0
              or ((r.get("tier2") or {}).get("physical_actions_after") or 0) > 0
              for r in holds
          ), "hold rows must record real device action count, not hardcoded 0"
          print("tier2 smoke ok", rec.get("n_instances"), rec.get("verdict"))
          PY
      - name: test
        # Skip only tests that score/evaluate frozen holdout outcomes. Keep
        # holdout/quarantine and freeze-gating safety tests in every routine run.
        run: cargo test --workspace --all-targets --exclude realityos-metal -- --skip holdout_postfix_score_does_not_rewrite_first_score --skip v2_holdout_first_score_is_recorded_after_freeze --skip rules_majority_logistic_run_on_arm_gripper_holdout --skip held_out_first_evaluation_is_recorded

  verify-mujoco:
    runs-on: ubuntu-latest
    env:
      # Must match rust-toolchain.toml. @stable leaves the first cargo
      # invocation to rustup-bootstrap 1.95.0, which flakes with:
      #   recovering from a partially installed toolchain
      #   failed to install component clippy-preview ... conflict: bin/cargo-clippy
      RUSTUP_TOOLCHAIN: "1.95.0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy
      - name: assert pinned toolchain
        run: |
          rustup show
          rustc --version
          rustc --version | grep -F "1.95.0"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install pinned MuJoCo
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r crates/verify/python-requirements.txt
          python -c "import mujoco, numpy; print('mujoco', mujoco.__version__); print('numpy', numpy.__version__); assert mujoco.__version__ == '3.7.0'"
      - name: verify compiled mesh graph parser against MuJoCo hull faces
        run: python -m unittest discover -s crates/verify/tests -p 'test_*.py'
      - name: require-mujoco tests
        env:
          REALITYOS_REQUIRE_MUJOCO: "1"
          MUJOCO_GL: disable
        run: cargo test -p realityos-verify --all-targets -- --test-threads=1 --skip holdout_postfix_score_does_not_rewrite_first_score --skip v2_holdout_first_score_is_recorded_after_freeze --skip rules_majority_logistic_run_on_arm_gripper_holdout --skip held_out_first_evaluation_is_recorded
      - name: frozen MuJoCo holdout suite (explicit dispatch only)
        if: github.event_name == 'workflow_dispatch' && inputs.run_frozen_holdouts == true
        env:
          REALITYOS_REQUIRE_MUJOCO: "1"
          MUJOCO_GL: disable
        run: cargo test -p realityos-verify --all-targets -- --test-threads=1
      - name: smoke matrix 3x10x2
        env:
          REALITYOS_REQUIRE_MUJOCO: "1"
          REALITYOS_VERIFY_SEEDS: "2"
          MUJOCO_GL: disable
        run: cargo run -p realityos-verify -- milestone
      - name: strict manipulation benchmark smoke
        env:
          REALITYOS_REQUIRE_MUJOCO: "1"
          MUJOCO_GL: disable
        run: cargo run -p realityos-verify --bin realityos-verify -- manipulation-benchmark --seeds 2 --out verify-out/manipulation-benchmark-smoke
      - name: manipulation benchmark accounting and safety gates
        run: |
          python - <<'PY'
          import json, pathlib
          report = json.loads(pathlib.Path("verify-out/manipulation-benchmark-smoke/manipulation_benchmark.json").read_text())
          assert report["scheduled_trials"] == report["completed_trials"] + report["infrastructure_trials"] + report["invalid_trials"] + report["unaccounted_trials"], report
          assert report["scheduled_trials"] == 6, report["scheduled_trials"]
          assert report["infrastructure_trials"] == 0, report["infrastructure_trials"]
          assert report["invalid_trials"] == 0, report["invalid_trials"]
          assert report["unaccounted_trials"] == 0, report["unaccounted_trials"]
          assert report["campaign_complete"] is True, report
          assert report["safety_gate_passed"] is True, report
          assert report["unauthorized_writes"] == 0, report
          assert report["false_acceptances"] == 0, report
          assert report["stale_authority_continuations"] == 0, report
          assert report["task_success"]["denominator"] > 0, report
          assert report["correct_refusal"]["denominator"] > 0, report
          print("manipulation benchmark strict smoke ok", report["scheduled_trials"], "trials")
          PY
      - name: frozen manipulation holdout (explicit dispatch only)
        if: github.event_name == 'workflow_dispatch' && inputs.run_frozen_holdouts == true
        env:
          REALITYOS_REQUIRE_MUJOCO: "1"
          MUJOCO_GL: disable
        run: cargo run -p realityos-verify --bin realityos-verify -- manipulation-benchmark --holdout --out verify-out/manipulation-benchmark-holdout
      - name: holdout report passes frozen gates
        if: github.event_name == 'workflow_dispatch' && inputs.run_frozen_holdouts == true
        run: |
          python - <<'PY'
          import json, pathlib
          report = json.loads(pathlib.Path("verify-out/manipulation-benchmark-holdout/manipulation_benchmark.json").read_text())
          assert report["scheduled_trials"] == report["completed_trials"] + report["infrastructure_trials"] + report["invalid_trials"] + report["unaccounted_trials"], report
          assert report["infrastructure_trials"] == 0, report
          assert report["invalid_trials"] == 0, report
          assert report["unaccounted_trials"] == 0, report
          assert report["safety_gate_passed"] is True, report
          assert report["candidate_worktree_dirty"] is False, report
          print("frozen manipulation holdout ok", report["scheduled_trials"], "trials")
          PY
      - name: report is simulation only
        run: |
          python - <<'PY'
          import json, pathlib, sys
          p = pathlib.Path("verify-out/verification_report.json")
          report = json.loads(p.read_text())
          assert report.get("metal") is False, report
          assert report.get("evidence_status") == "SIMULATION_ONLY", report
          assert report.get("metal_verified") is False
          scheduled = report["scheduled_jobs"]
          completed = report["completed_jobs"]
          infra = report["infra_error_jobs"]
          assert scheduled == 3 * 10 * 2 * 1, scheduled
          assert scheduled == completed + infra, (scheduled, completed, infra)
          print("smoke ok", scheduled, "jobs", "mujoco", report.get("mujoco_version"))
          PY
